; GTA-SA-Harness toolkit configuration.
; Copy this file to config.ini, fill in YOUR values, save, then run:
;     python setup.py

[console]
; Your PS5's IP address on your home network (find it in Settings > Network).
; The console's FTP server (part of the homebrew environment) must be running.
ftp_host = 192.168.1.100
ftp_port = 1337
; Where the Wine prefix lives on the console. Leave as-is unless you moved it.
prefix = /data/wowps5/prefix

[game]
; The folder of YOUR installed copy of GTA San Andreas.
; Must be the PC v1.0 US retail ("compact") edition - the setup checks this for you.
install_dir = C:\Program Files (x86)\Rockstar Games\GTA San Andreas

[samp]
; The folder with the SAMP 0.3.7-R5 client files you downloaded from sa-mp.mp.
install_dir = C:\Users\you\Downloads\samp037
